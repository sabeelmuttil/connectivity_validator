name: connectivity_validator
description: "Validated internet connectivity for Flutter: detects real internet access (not just a network link) and captive portals on Android, iOS, macOS, and Web."
version: 0.1.2
homepage: https://github.com/sabeelmuttil/connectivity_validator
repository: https://github.com/sabeelmuttil/connectivity_validator
issue_tracker: https://github.com/sabeelmuttil/connectivity_validator/issues

topics:
  - connectivity
  - network
  - internet
  - captive-portal
  - offline

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  web: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  plugin:
    platforms:
      android:
        package: com.skm.connectivity_validator
        pluginClass: ConnectivityValidatorPlugin
      ios:
        pluginClass: ConnectivityValidatorPlugin
      macos:
        pluginClass: ConnectivityValidatorPlugin
      web:
        pluginClass: ConnectivityValidatorPlugin
        fileName: connectivity_validator_web.dart
